<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>The Hunt Expedition — Fully Offline College Treasure Hunt</title>
    <meta name="description" content="Offline-first treasure hunt expedition application for 8 teams across 4 levels and 40 questions." />
    <meta name="theme-color" content="#121416" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then((reg) => {
            console.log('[Offline Engine] Service Worker registered:', reg.scope);
          }).catch((err) => {
            console.warn('[Offline Engine] Service Worker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
